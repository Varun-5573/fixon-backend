<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FixoN - Hyper Advanced Typography</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Syncopate:wght@700&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  body { background: #030308; color: #fff; font-family: "Outfit", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 40px; }
  
  .banner { background: #0A0A16; border-radius: 30px; border: 1px solid rgba(124, 58, 237, 0.2); width: 800px; height: 350px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); cursor: pointer; transition: 0.4s; background: radial-gradient(circle at right, rgba(124,58,237,0.3) 0%, #0A0A16 60%); }
  .banner:hover { border-color: #06B6D4; box-shadow: 0 10px 50px rgba(6, 182, 212, 0.2); transform: scale(1.02); }
  
  /* Var 2: The Hyper Speed (Italic, Splitted Flow) WITHOUT SLASH */
  .v2-text { font-family: "Montserrat", sans-serif; font-style: italic; font-size: 130px; font-weight: 900; letter-spacing: -2px; display: flex; align-items: center; justify-content: center; position: relative;}
  .v2-text .fix { color: #fff; text-shadow: 6px 6px 0px rgba(124, 58, 237, 0.8), 12px 12px 0px rgba(6, 182, 212, 0.5); position: relative; z-index: 2;}
  .v2-text .on { background: linear-gradient(90deg, #06B6D4, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; display: inline-block; padding-left: 5px; filter: drop-shadow(0 0 10px rgba(6,182,212,0.3));}

</style>
</head>
<body>
  
  <div class="banner">
    <div class="v2-text">
      <span class="fix">FIX</span><span class="on">ON</span>
    </div>
  </div>

</body>
</html>
